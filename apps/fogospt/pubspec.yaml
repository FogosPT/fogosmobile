name: fogospt
description: "Fogos App"
publish_to: 'none'

version: 1.4.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  dart_mappable: ^4.2.2
  equatable: ^2.0.2
  firebase_core: ^3.2.0
  firebase_messaging: ^15.0.3
  fl_chart: ^0.68.0
  flutter_bloc: ^8.1.6
  flutter_launcher_icons: ^0.13.1
  flutter_local_notifications: ^17.2.1+2
  flutter_map: ^7.0.2
  flutter_native_splash: ^2.4.0
  flutter_svg: ^2.0.10+1
