name: fogosmobile
description: Fogos.pt new iOS and Android app

version: 5.0.1+500010

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  sentry_flutter: ^8.12.0
  cupertino_icons: ^1.0.8
  redux: ^5.0.0
  flutter_redux: ^0.10.0
  redux_logging: ^0.5.0
  mapbox_maps_flutter: ^2.6.0
  http: ^1.2.2
  dio: ^5.7.0
  firebase_messaging: ^15.1.6
  firebase_analytics: ^11.3.6
  firebase_core: ^3.8.1
  shared_preferences: ^2.3.4
  diacritic: ^0.1.5
  url_launcher: ^6.3.1
  flutter_markdown: ^0.7.4
  auto_size_text: ^3.0.0

  font_awesome_flutter: ^10.8.0

  share_plus: ^10.1.3
  cached_network_image: ^3.4.1

  #ui
  flutter_svg: ^2.0.16
  modal_progress_hud_nsn: ^0.5.0
  community_charts_flutter: ^1.0.2

  #localizations
  intl: ^0.20.2
  equatable: ^2.0.7
  logger: ^2.5.0

dev_dependencies:
  build_runner: ^2.4.13
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
    - assets/partners/
